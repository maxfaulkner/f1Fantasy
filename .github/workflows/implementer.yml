name: Claude Implementer

on:
  issues:
    types: [labeled]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]
  repository_dispatch:
    types: [request-changes]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  implement-from-issue:
    if: github.event_name == 'issues' && github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load implementer role
        id: role
        run: |
          {
            echo 'content<<ROLE_EOF'
            cat .swarm/roles/implementer.md
            echo 'ROLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ steps.role.outputs.content }}

            ---

            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            Issue #${{ github.event.issue.number }} has been approved. Read it in full, then implement it following the role instructions above.
          claude_args: |
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh pr create:*),Bash(gh pr edit:*),Bash(gh pr comment:*),Bash(gh pr view:*),Bash(npm test:*),Bash(npm run:*)"

  resume-pr:
    # Fires when a human (non-bot) comments exactly /resume on a swarm PR
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.sender.type != 'Bot' &&
      startsWith(github.event.comment.body, '/resume') &&
      contains(github.event.issue.labels.*.name, 'swarm-implementation')
    runs-on: ubuntu-latest
    steps:
      - name: Reset round count and restart loop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=${{ github.event.issue.number }}
          REPO=${{ github.repository }}
          # Post the reset marker (reviewer counts verdicts after this timestamp)
          gh pr comment $PR --repo $REPO --body "[SWARM RESUME — round count reset by @${{ github.actor }}]"
          # Remove the needs-human label
          gh pr edit $PR --repo $REPO --remove-label needs-human || true
          # Get the branch and kick the implementer
          branch=$(gh pr view $PR --repo $REPO --json headRefName --jq '.headRefName')
          gh api repos/$REPO/dispatches \
            --field event_type=request-changes \
            --field "client_payload[pr_number]=$PR" \
            --field "client_payload[branch]=$branch"

  respond-to-review:
    # Fires when:
    # - reviewer posts REQUEST_CHANGES (routed via repository_dispatch to bypass GITHUB_TOKEN anti-loop)
    # - formal REQUEST_CHANGES review from a human (pull_request_review event)
    # - VERDICT: REQUEST_CHANGES comment (issue_comment fallback)
    if: |
      (
        github.event_name == 'repository_dispatch' &&
        github.event.action == 'request-changes'
      ) || (
        github.event_name == 'pull_request_review' &&
        github.event.review.state == 'changes_requested' &&
        contains(github.event.pull_request.labels.*.name, 'swarm-implementation')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, 'VERDICT: REQUEST_CHANGES') &&
        contains(github.event.issue.labels.*.name, 'swarm-implementation')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "number=${{ github.event.client_payload.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            branch=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - name: Load implementer role
        id: role
        run: |
          {
            echo 'content<<ROLE_EOF'
            cat .swarm/roles/implementer.md
            echo 'ROLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            ${{ steps.role.outputs.content }}

            ---

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            The reviewer has posted REQUEST_CHANGES on PR #${{ steps.pr.outputs.number }}. Read the review comments carefully, then respond following the role instructions above.
          claude_args: |
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git log:*),Bash(git diff:*),Bash(git status:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr review:*),Bash(npm test:*),Bash(npm run:*)"

      - name: Notify reviewer that implementer is done
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            --field event_type=review-requested \
            --field "client_payload[pr_number]=${{ steps.pr.outputs.number }}" \
            --field "client_payload[branch]=${{ steps.pr.outputs.branch }}"
