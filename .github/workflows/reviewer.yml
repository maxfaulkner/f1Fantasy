name: Claude Reviewer

on:
  repository_dispatch:
    types: [review-requested]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    if: |
      (github.event_name == 'repository_dispatch' && github.event.action == 'review-requested') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       github.event.sender.type != 'Bot' &&
       startsWith(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number and branch
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "number=${{ github.event.client_payload.pr_number }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.client_payload.branch }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "issue_comment" ]; then
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
            branch=$(gh pr view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json headRefName --jq '.headRefName')
            echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.branch }}
          fetch-depth: 0

      - name: Count prior review rounds
        id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find timestamp of the last /resume reset (epoch 0 if never resumed)
          last_resume=$(gh api repos/${{ github.repository }}/issues/${{ steps.pr.outputs.number }}/comments \
            --jq '[.[] | select(.body | startswith("[SWARM RESUME"))] | last | .created_at // "1970-01-01T00:00:00Z"')
          # Only count VERDICT reviews submitted after the last reset
          rounds=$(gh pr view ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --json reviews | \
            jq --arg since "$last_resume" \
            '[.reviews[] | select(.author.login == "github-actions" or .author.login == "github-actions[bot]" or .author.login == "claude" or .author.login == "claude[bot]") | select(.body | contains("VERDICT:")) | select(.submittedAt > $since)] | length')
          echo "count=${rounds:-0}" >> $GITHUB_OUTPUT

      - name: Stop if max rounds exceeded
        if: fromJson(steps.rounds.outputs.count) >= 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ steps.pr.outputs.number }} --add-label needs-human
          gh pr comment ${{ steps.pr.outputs.number }} \
            --body "@${{ github.repository_owner }} max review rounds (5) reached on this PR. To give the agents another cycle, comment \`/resume\` on this PR. Or review and merge/close manually."

      - name: Load reviewer role
        if: fromJson(steps.rounds.outputs.count) < 5
        id: role
        run: |
          {
            echo 'content<<ROLE_EOF'
            cat .swarm/roles/reviewer.md
            echo 'ROLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Dismiss stale bot reviews before re-reviewing
        if: fromJson(steps.rounds.outputs.count) < 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews \
            --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == "github-actions") and .state == "CHANGES_REQUESTED") | .id' \
          | while read review_id; do
              gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews/${review_id}/dismissals \
                -X PUT --field message="Superseded by new review round." || true
            done

      - uses: anthropics/claude-code-action@v1
        if: fromJson(steps.rounds.outputs.count) < 5
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-haiku-4-5-20251001
          # Use GITHUB_TOKEN so reviewer acts as github-actions[bot], not claude[bot].
          # This allows formal APPROVE/REQUEST_CHANGES reviews on PRs opened by claude[bot].
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "claude[bot],github-actions[bot]"
          prompt: |
            ${{ steps.role.outputs.content }}

            ---

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            Review this PR now following the role instructions above. Use `gh pr review` to submit the formal verdict (REQUEST_CHANGES or APPROVE).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"

      - name: Trigger implementer if changes requested
        if: fromJson(steps.rounds.outputs.count) < 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 5
          verdict=$(gh pr view ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --json reviews \
            --jq '[.reviews[] | select(.author.login == "github-actions" or .author.login == "github-actions[bot]") | select(.state == "CHANGES_REQUESTED" or .state == "APPROVED")] | last | .state // ""')
          if [ "$verdict" = "CHANGES_REQUESTED" ]; then
            gh api repos/${{ github.repository }}/dispatches \
              --field event_type=request-changes \
              --field "client_payload[pr_number]=${{ steps.pr.outputs.number }}" \
              --field "client_payload[branch]=${{ steps.pr.outputs.branch }}"
          fi

      - name: Request human review after approval
        if: fromJson(steps.rounds.outputs.count) < 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          verdict=$(gh pr view ${{ steps.pr.outputs.number }} \
            --repo ${{ github.repository }} \
            --json reviews \
            --jq '[.reviews[] | select(.author.login == "github-actions" or .author.login == "github-actions[bot]") | select(.state == "CHANGES_REQUESTED" or .state == "APPROVED")] | last | .state // ""')
          if [ "$verdict" = "APPROVED" ]; then
            gh pr edit ${{ steps.pr.outputs.number }} \
              --add-reviewer ${{ github.repository_owner }} || true
          fi
