name: Claude Reviewer

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    # Only review PRs labeled by the implementer agent. Skip human PRs.
    if: contains(github.event.pull_request.labels.*.name, 'swarm-implementation')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count prior review rounds
        id: rounds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rounds=$(gh pr view ${{ github.event.pull_request.number }} \
            --json reviews \
            --jq '[.reviews[] | select(.author.login == "claude" or .author.login == "claude[bot]") | select(.body | contains("VERDICT:"))] | length')
          echo "count=${rounds:-0}" >> $GITHUB_OUTPUT

      - name: Stop if max rounds exceeded
        if: fromJson(steps.rounds.outputs.count) >= 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit ${{ github.event.pull_request.number }} --add-label needs-human
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "@${{ github.repository_owner }} max review rounds (3) reached on this PR. Human decision needed before further iteration."

      - name: Load reviewer role
        if: fromJson(steps.rounds.outputs.count) < 3
        id: role
        run: |
          {
            echo 'content<<ROLE_EOF'
            cat .swarm/roles/reviewer.md
            echo 'ROLE_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: fromJson(steps.rounds.outputs.count) < 3
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ steps.role.outputs.content }}

            ---

            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR now following the role instructions above. Use `gh pr review` to submit the formal verdict (REQUEST_CHANGES or APPROVE).
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Read,Glob,Grep"
